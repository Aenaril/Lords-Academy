# Configuration Cloudflare Pages + Functions
#
# Pour Cloudflare Pages avec déploiement Git :
# - Build command, output directory, root directory → configurés dans Dashboard Cloudflare
# - Pages Functions → détectées automatiquement depuis app/functions/
# - Variables et secrets → configurés dans Dashboard Cloudflare (Settings → Environment variables)
# - KV Namespaces → liés dans Dashboard Cloudflare (Settings → Functions → KV Namespace Bindings)
#
# Ce fichier est conservé pour documentation et compatibilité avec d'autres outils.

name = "lords-mobile-academy"
compatibility_date = "2024-10-01"

# Pages Functions — répertoire contenant les handlers API
functions = { directory = "app/functions" }

# Référence des variables et secrets attendus par l'API (à configurer dans Dashboard) :
# 
# VARIABLES (publiques) :
#   ALLOWED_ORIGIN    → domaine Pages (ex: https://lords-mobile-academy.pages.dev)
#   GITHUB_REPO       → identifiant du repo (ex: Aenaril/Lords-Academy)
#   GITHUB_BRANCH     → branche cible (ex: main)
#
# SECRETS (chiffrés) :
#   ADMIN_PASSWORD        → mot de passe partagé d'accès aux R4
#   SESSION_SIGNING_KEY   → clé HMAC pour signer les sessions HttpOnly
#   GITHUB_TOKEN          → token GitHub fine-grained (public_repo + gist scopes)
#
# KV NAMESPACES (via Pages Function bindings) :
#   DRAFTS    → stockage des brouillons privés d'édition
#   RATE      → compteurs pour le rate-limiting
