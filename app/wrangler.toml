# Configuration Wrangler pour Pages Functions
# Permet aux Pages Functions d'accéder au Worker Durable Objects

name = "lords-mobile-academy"
main = "dist/index.js"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

# Binding vers le Worker Durable Objects lma-drafts-worker
[[durable_objects.bindings]]
name = "DRAFTS_DO"
class_name = "DraftsDoClass"
script_name = "lma-drafts-worker"

# NOTE: Pages Functions utilisent app/functions/api/[[path]].ts
# Le Worker Durable Objects se trouve dans worker/wrangler.toml (lma-drafts-worker)
