# Configuration Wrangler pour tests Cloudflare Workers
# Utilisé uniquement pour les tests Vitest avec @cloudflare/vitest-plugin

name = "lords-mobile-academy-test"
main = "src/index.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

# Durable Objects pour tests
[[durable_objects.bindings]]
name = "DRAFTS_DO"
class_name = "DraftsDoClass"
script_name = "lords-mobile-academy-test"

# Migrations
[[migrations]]
tag = "v1"
new_classes = ["DraftsDoClass"]

# NOTE: Ce wrangler.toml est pour tests locaux uniquement
# Les Pages Functions utilisent app/functions/api/[[path]].ts
# Le Worker réel se trouve dans worker/wrangler.toml
