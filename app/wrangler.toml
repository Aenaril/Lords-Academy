# Configuration Wrangler pour tests Cloudflare Workers & Pages Functions
# Utilisé uniquement pour les tests Vitest avec @cloudflare/vitest-plugin
# Et pour les tests locaux d'endpoints Pages Functions

name = "lords-mobile-academy-test"
main = "src/index.ts"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]

# Durable Objects pour tests
[[durable_objects.bindings]]
name = "DRAFTS_DO"
class_name = "DraftsDoClass"
script_name = "lords-mobile-academy-test"

# Migrations
[[migrations]]
tag = "v1"
new_classes = ["DraftsDoClass"]

# D1 Database for Pages Functions (local dev)
# Note: In production, D1 is bound via Cloudflare Pages Dashboard
# For local development with wrangler pages dev, use CLI flags: --d1 DB

# KV Namespace for Pages Functions (local dev)
# Note: In production, KV is bound via Cloudflare Pages Dashboard
# For local development with wrangler pages dev, use CLI flags: --kv KV

# NOTE: Ce wrangler.toml est pour tests locaux uniquement
# Les Pages Functions utilisent app/functions/api/[[path]].ts
# Le Worker réel se trouve dans worker/wrangler.toml
