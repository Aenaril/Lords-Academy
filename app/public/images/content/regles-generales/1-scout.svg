<svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .rg-title { font-size: 14px; font-weight: bold; fill: #D84D00; }
      .rg-text { font-size: 12px; fill: #333; }
      .rg-box { fill: #f5f5f0; stroke: #D84D00; stroke-width: 2; }
      .rg-arrow { fill: none; stroke: #3B6FA8; stroke-width: 2; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#3B6FA8"/>
    </marker>
  </defs>
  
  <rect class="rg-box" x="20" y="20" width="80" height="60" rx="5"/>
  <text class="rg-title" x="30" y="45">Scout</text>
  <text class="rg-text" x="30" y="65">Test phalange</text>
  
  <path class="rg-arrow" d="M 110 50 L 160 50"/>
  
  <rect class="rg-box" x="170" y="20" width="100" height="60" rx="5"/>
  <text class="rg-title" x="180" y="45">Rapport</text>
  <text class="rg-text" x="180" y="65">Post Discord</text>
  
  <rect class="rg-box" x="60" y="110" width="180" height="60" rx="5"/>
  <text class="rg-text" x="70" y="135">Ensuite: Interdiction</text>
  <text class="rg-text" x="70" y="160">✗ Spy ✗ Flamis ✗ Test</text>
</svg>
