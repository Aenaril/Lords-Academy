<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Background -->
  <rect width="192" height="192" fill="#C41E3A" rx="32"/>
  
  <!-- Castle/Kingdom theme -->
  <!-- Main tower -->
  <rect x="60" y="50" width="72" height="100" fill="#FFF8DC"/>
  
  <!-- Tower battlements (créneaux) -->
  <rect x="60" y="45" width="12" height="10" fill="#FFF8DC"/>
  <rect x="90" y="45" width="12" height="10" fill="#FFF8DC"/>
  <rect x="120" y="45" width="12" height="10" fill="#FFF8DC"/>
  
  <!-- Side towers -->
  <rect x="40" y="80" width="20" height="70" fill="#FFB6C1"/>
  <rect x="132" y="80" width="20" height="70" fill="#FFB6C1"/>
  
  <!-- Door -->
  <rect x="84" y="110" width="24" height="40" fill="#8B4513"/>
  
  <!-- Cross symbol (for Academy/Education) -->
  <g transform="translate(96, 70)">
    <rect x="-4" y="-12" width="8" height="24" fill="none" stroke="#333" stroke-width="2"/>
    <rect x="-12" y="-4" width="24" height="8" fill="none" stroke="#333" stroke-width="2"/>
  </g>
  
  <!-- Decorative shields at base -->
  <circle cx="60" cy="160" r="8" fill="#FFD700"/>
  <circle cx="96" cy="160" r="8" fill="#FFD700"/>
  <circle cx="132" cy="160" r="8" fill="#FFD700"/>
</svg>
