# Cloudflare Worker Configuration — Phase C Cron (Scheduled Notifications)
# 
# ATTENTION: Ce fichier est PRÉPARATOIRE.
# N'activate PAS le Cron trigger automatiquement.
# À utiliser SEULEMENT après validation utilisateur.

name = "lma-notifications-cron"
main = "dist/index-cron.js"
compatibility_date = "2024-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# ✅ CRON ACTIVÉ — Phase C Production (HORAIRE)
# 
# Exécution: Toutes les heures à HH:00:00 UTC
# Déploiement: wrangler deploy --config wrangler-cron.toml --env production
[triggers]
crons = ["0 * * * *"]  # 00:00, 01:00, 02:00, ..., 23:00 UTC (toutes les heures)

# KV Namespace (Phase B production)
[env.production]
kv_namespaces = [
  { binding = "NOTIFICATIONS_SUBSCRIPTIONS", id = "b806f10c63a640cb81754b7e3ca8f9ae" }
]

# Variables d'environnement
[env.production.vars]
# Pages domain où le CMS est publié
PAGES_URL = "https://lords-academy.pages.dev"

# VAPID public key (P-256, 65 bytes base64url)
# Private key is stored as a secret in Cloudflare (not in this file)
VAPID_PUBLIC_KEY = "BCuvGtABJrmtCHk6Xuxgj3VI00vfxj6k3RUV4b4T8ERiTMP7CJEAyjSKoPinKfGxzIZVeG5t1qcGZD5i5TS7Hl4"

# Notes sur les secrets à configurer dans Cloudflare Dashboard:
# - VAPID_PRIVATE_KEY (base64url 32 bytes ou JWK) — SECRET
# - CRON_CMS_READ_TOKEN — SECRET
# Ne PAS les ajouter dans ce fichier (fichier versionnée dans Git)

# Configuration Deployments:
# Pour déployer ce Worker (une fois validé):
#   wrangler deploy --config wrangler-cron.toml --env production
#
# Pour activer le Cron (une fois validé):
#   1. Décommenter [triggers] et crons = ["0 * * * *"] ci-dessous
#   2. Re-déployer: wrangler deploy --config wrangler-cron.toml --env production
#   3. Vérifier exécution dans Cloudflare Dashboard → Workers → Triggers
#
# Cron Schedule Reference:
#   "0 * * * *"  = À HH:00:00 UTC chaque heure
#   "0 0 * * *"  = À minuit UTC chaque jour
#   "0 9 * * MON" = À 09:00 UTC chaque lundi
#
# TTL et Tolérances:
#   - Déduplication: 7 jours (KV expiration)
#   - Fenêtre Cron: ±60 minutes autour de dueTime
#   - Pas d'envoi anticipé (now >= dueTime)
#   - Pas d'envoi excessivement tardif (now - dueTime < 60min)
